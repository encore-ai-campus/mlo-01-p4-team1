global
  log stdout format raw local0
  maxconn 1000

defaults
  log global
  mode http
  option httplog
  timeout connect 4s
  timeout client 25s
  timeout server 25s
  retries 2

frontend es_public
  bind *:9200
  default_backend es_internal

backend es_internal
  balance roundrobin
  option httpchk GET /
  http-check expect status 200
  server es-01 es-01:9200 check inter 2s fall 2 rise 2
  server es-02 es-02:9200 check inter 2s fall 2 rise 2
  server es-03 es-03:9200 check inter 2s fall 2 rise 2
