name: Runtime offline checks
on:
  pull_request:
    paths: ['aws-infra/runtime/**', 'aws-infra/contracts/**', '.github/workflows/runtime-check.yml']
  workflow_dispatch:
    inputs:
      integration:
        description: Run Docker integration on the prepared locked Linux runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.8'
      - run: python -m venv aws-infra/runtime/.venv
      - run: aws-infra/runtime/.venv/bin/python -m pip install -r aws-infra/runtime/requirements.lock.txt
      - run: make PYTHON=aws-infra/runtime/.venv/bin/python prep-check prep-test runtime-unit
  local-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    needs: unit
    runs-on: [self-hosted, Linux, X64, mlo-runtime-locked]
    timeout-minutes: 30
    env:
      RUNTIME_LAB_PLATFORM: linux/amd64
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: test "$(docker version --format '{{.Client.Version}}')" = 29.8.0
      - run: test "$(docker compose version --short)" = 5.5.1
      - run: bash aws-infra/runtime/scripts/prepare-lab.sh
      - run: make runtime-integration
