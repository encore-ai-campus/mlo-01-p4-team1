name: Integrated offline acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-acceptance:
    runs-on: [self-hosted, Linux, X64, mlo-runtime-locked]
    timeout-minutes: 60
    env:
      RUNTIME_LAB_PLATFORM: linux/amd64
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Check prepared local runner
        run: |
          test "$(docker version --format '{{.Client.Version}}')" = 29.8.0
          test "$(docker compose version --short)" = 5.5.1
      - name: Prepare pinned local test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -r requirements-common.lock.txt
          .venv/bin/python aws-infra/foundation/scripts/setup-local.py
          bash aws-infra/runtime/scripts/prepare-lab.sh
      - name: Rebuild C environment from administrator prepared offline dependencies
        env:
          MLO_C_PYTHON: ${{ vars.LIFECYCLE_PREPARED_PYTHON }}
          MLO_C_WHEELS: ${{ vars.LIFECYCLE_PREPARED_WHEELHOUSE }}
          MLO_C_TERRAFORM: ${{ vars.LIFECYCLE_PREPARED_TERRAFORM_ARCHIVE }}
          PYTHONNOUSERSITE: '1'
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          test -x "$MLO_C_PYTHON"
          test -d "$MLO_C_WHEELS"
          test -f "$MLO_C_TERRAFORM"
          /usr/bin/python3 - <<'PY'
          import os, pathlib, sys
          workspace = pathlib.Path.cwd().resolve()
          for name in ('MLO_C_PYTHON', 'MLO_C_WHEELS', 'MLO_C_TERRAFORM'):
              path = pathlib.Path(os.environ[name])
              assert path.is_absolute() and not path.resolve().is_relative_to(workspace)
              resolved = path.resolve()
              for item in (resolved, *resolved.parents):
                  info = item.stat()
                  assert info.st_uid == 0 and not info.st_mode & 0o022
          for item in pathlib.Path(os.environ['MLO_C_WHEELS']).rglob('*'):
              assert item.is_file() and item.suffix == '.whl' and not item.is_symlink()
              info = item.stat()
              assert info.st_uid == 0 and not info.st_mode & 0o022
          PY
          "$MLO_C_PYTHON" -c 'import sys; assert sys.version_info[:3] == (3, 14, 8)'
          "$MLO_C_PYTHON" -m venv aws-infra/lifecycle/.venv
          aws-infra/lifecycle/.venv/bin/python -m pip install --no-index --find-links "$MLO_C_WHEELS" -r aws-infra/lifecycle/requirements.lock.txt
          aws-infra/lifecycle/.venv/bin/python aws-infra/lifecycle/scripts/setup-toolchain.py --archive "$MLO_C_TERRAFORM"
      - name: Test A/B/C implementations and their common execution boundary
        run: make predeploy-check
      # No AWS credentials, id-token permission, image publication or deployment.
