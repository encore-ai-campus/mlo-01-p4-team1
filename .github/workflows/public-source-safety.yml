name: Public source safety
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-privacy:
    name: Prevent private reports and common secrets in public source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only this repository
        uses: actions/checkout@v4
      - name: Scan entire checked-out source
        run: python3 scripts/check_public_release.py
      - name: Scan app source
        run: python3 app/docker/check_git_candidates.py
