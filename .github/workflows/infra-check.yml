name: Foundation offline checks
on:
  pull_request:
    paths:
      - 'aws-infra/foundation/**'
      - 'aws-infra/contracts/**'
      - 'scripts/check_preparation.py'
      - 'requirements-common.lock.txt'
      - '.github/workflows/infra-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Prepare pinned local dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -r requirements-common.lock.txt
          .venv/bin/python aws-infra/foundation/scripts/setup-local.py
      - name: Contracts, unit and mocked integration
        run: make prep-check prep-test foundation-unit foundation-integration
